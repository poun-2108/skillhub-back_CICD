name: TP5 CI/CD

on:
  push:
    branches: [main, tp5-dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}      # ✅ déclaré au niveau job
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Droits mvnw
        run: chmod +x mvnw

      - name: Build + Tests Maven
        run: ./mvnw clean verify

      - name: Analyse SonarCloud
        if: env.SONAR_TOKEN != ''                  # ✅ env autorisé dans if:
        run: ./mvnw sonar:sonar -Dsonar.token=$SONAR_TOKEN

      - name: Build image Docker
        run: docker build -t nirina2108/tp_5_docker:latest .

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Hub
        run: docker push nirina2108/tp_5_docker:latest