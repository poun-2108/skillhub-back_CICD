name: CI SkillHub

on:
  push:
    branches: ["**"]

  pull_request:
    branches: ["**"]

jobs:

  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, zip, mongodb-2.2.0

      - name: Installer, preparer et tester Laravel
        working-directory: skillhub-back
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret --force
          php artisan config:clear
          php artisan test

  springboot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Permissions mvnw
        working-directory: springboot
        run: chmod +x mvnw

      - name: Build et tests Maven
        working-directory: springboot
        run: ./mvnw clean verify -B

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skillhub-front/package-lock.json

      - name: Installer et builder le frontend
        working-directory: skillhub-front
        run: |
          npm ci
          npm run build