# ──────────────────────────────────────────────────────────────────────────────
# SonarCloud — Backend Laravel SkillHub
# Organisation : nirina2108  (même org que le projet Spring Boot)
# À créer dans SonarCloud : https://sonarcloud.io/projects/create
# ──────────────────────────────────────────────────────────────────────────────

sonar.organization=nirina2108
sonar.projectKey=Nirina2108_skillhub-back_CICD
sonar.projectName=SkillHub — Backend Laravel
sonar.projectVersion=1.0

# ── Sources & Tests ────────────────────────────────────────────────────────────
sonar.sources=app
sonar.tests=tests

# ── Couverture PHP (rapport Clover généré par PHPUnit) ────────────────────────
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=junit.xml

# ── Exclusions d'analyse ──────────────────────────────────────────────────────
# Vendor, caches et artefacts non analysés.
sonar.exclusions=\
  **/vendor/**,\
  **/bootstrap/cache/**,\
  **/storage/**,\
  **/public/**,\
  **/resources/views/**,\
  **/database/migrations/**,\
  **/database/seeders/**,\
  **/database/factories/**,\
  **/config/**,\
  **/routes/**,\
  **/artisan

# ── Exclusions de duplication ─────────────────────────────────────────────────
# Les migrations/seeders/fixtures contiennent naturellement des schémas
# similaires qui ne constituent pas une vraie duplication métier.
sonar.cpd.exclusions=\
  **/database/**,\
  **/tests/**

# ── Exclusions de couverture ──────────────────────────────────────────────────
# Fichiers non testables unitairement (intégrations externes, boot).
sonar.coverage.exclusions=\
  app/Models/ActivityLog.php,\
  app/Services/ActivityLogService.php,\
  app/Mail/**,\
  app/Providers/**,\
  app/Http/Middleware/**,\
  app/Console/**,\
  bootstrap/**

# ── Encoding ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
