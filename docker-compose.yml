services:
  mysql:
    image: mysql:8.0
    container_name: skillhub_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: skillhub_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  springboot:
    build: ./springboot
    container_name: skillhub_auth
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/skillhub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

  laravel:
    build: ./laravel
    container_name: skillhub_laravel
    ports:
      - "9000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./front-end
    container_name: skillhub_front
    ports:
      - "5173:5173"
    depends_on:
      - springboot
      - laravel

volumes:
  mysql_data: