name: CI — auth-service

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:

  test:
    name: Tests JUnit + Coverage + SonarCloud
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: springboot

    steps:

      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Permissions mvnw
        run: chmod +x mvnw

      - name: Build et tests Maven
        run: ./mvnw clean verify -B

      - name: Verification coverage JaCoCo >= 96%
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          import sys

          try:
              tree = ET.parse('target/site/jacoco/jacoco.xml')
              root = tree.getroot()
          except FileNotFoundError:
              print("ERREUR : Rapport JaCoCo introuvable.")
              sys.exit(1)

          missed, covered = 0, 0
          for counter in root.findall('.//counter[@type="INSTRUCTION"]'):
              missed  += int(counter.get('missed', 0))
              covered += int(counter.get('covered', 0))

          total = missed + covered
          if total == 0:
              print("AVERTISSEMENT : Aucune instruction trouvee.")
              sys.exit(0)

          ratio = (covered / total) * 100
          print(f"Coverage JaCoCo : {ratio:.2f}% ({covered}/{total} instructions)")

          if ratio < 96.0:
              print(f"ECHEC : {ratio:.2f}% inferieur au seuil de 96%")
              sys.exit(1)

          print(f"OK : {ratio:.2f}% >= 96%")
          PYEOF

      - name: Analyse SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }} -B

  docker:
    name: Build et Push Docker Hub
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    defaults:
      run:
        working-directory: springboot

    steps:

      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Definir le tag Docker
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build et Push image auth-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/skillhub-auth:${{ steps.tag.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/skillhub-auth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resume
        run: |
          echo "Image publiee :"
          echo "  ${{ secrets.DOCKER_USERNAME }}/skillhub-auth:${{ steps.tag.outputs.tag }}"
          echo "  ${{ secrets.DOCKER_USERNAME }}/skillhub-auth:${{ github.sha }}"